name: Account server
on:
  pull_request:
    paths: ["server/**", "tools/sync_github_updates.py", "tools/tests/test_sync_github_updates.py", "deploy/kanvas-update-mirror.*", ".github/workflows/server.yml"]
  push:
    branches: [main, "codex/**"]
    paths: ["server/**", "tools/sync_github_updates.py", "tools/tests/test_sync_github_updates.py", "deploy/kanvas-update-mirror.*", ".github/workflows/server.yml"]
  workflow_dispatch:
    inputs:
      publish_image:
        description: Publish the server container to GHCR
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kellikanvas_test
          POSTGRES_USER: kanvas_test
          POSTGRES_PASSWORD: local-test-only
        ports: ["16439:5432"]
        options: >-
          --health-cmd "pg_isready -U kanvas_test -d kellikanvas_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test server/KelliKanvas.Server.Tests/KelliKanvas.Server.Tests.csproj --configuration Release --logger trx
      - run: python3 -m unittest tools.tests.test_sync_github_updates
      - run: docker build -f server/Dockerfile -t kellikanvas-server:check server
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Sign in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-server"
          docker build -f server/Dockerfile -t "$image:${GITHUB_SHA}" -t "$image:latest" server
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
