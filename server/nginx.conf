# Adapt server_name and certificate paths for the chosen hostname.
server {
    listen 80;
    server_name kanvas.kelli.photo;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name kanvas.kelli.photo;
    ssl_certificate /etc/letsencrypt/live/kanvas.kelli.photo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kanvas.kelli.photo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    # OAuth callbacks carry a short-lived code. Keep query strings out of this site's logs.
    access_log off;
    location ~ ^/updates/\. { return 404; }
    location /updates/ {
        alias /var/www/kanvas-updates/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        types { application/vnd.android.package-archive apk; application/json json; text/plain sha256; }
    }
    location / {
        proxy_pass http://127.0.0.1:6080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
